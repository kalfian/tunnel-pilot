[package]
name = "tunnel-pilot"
version = "2.2.0"
description = "Cross-platform SSH local port forwarding manager"
authors = ["Kalfian"]
edition = "2021"
rust-version = "1.77"
# `pnpm tauri build|dev` and a bare `cargo run` mean the desktop app.
default-run = "tunnel-pilot"

# The library target is what the Tauri app runs; main.rs is a thin entry that
# calls `run()`. cdylib/staticlib kept for parity with the Tauri template.
[lib]
name = "tunnel_pilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Two products, one codebase (spec 03 §21–22): identical features, different
# delivery. `tunnel-pilot` is the desktop tray app; `tunnel-pilot-cli` is the
# headless server (daemon + web UI). Each binary only builds when its feature
# set is enabled, so one `cargo build` never produces the wrong product.
[[bin]]
name = "tunnel-pilot"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "tunnel-pilot-cli"
path = "src/bin/tunnel-pilot-cli.rs"
required-features = ["server"]

[build-dependencies]
# Optional: only the `gui` feature runs `tauri_build::build()` (build.rs). The
# headless CLI build (`--no-default-features`) never touches Tauri.
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
# Tauri core. `tray-icon` enables the system tray; `image-png` lets us decode a
# PNG icon at runtime for the tray.
# Optional behind the `gui` feature (default on). `--no-default-features`
# builds the headless CLI/daemon binary with no Tauri, WebKit or GTK linked.
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"                        # binary edges only (setup/main) — never in a command return type
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros", "signal", "fs"] }
tokio-util = "0.7"                  # CancellationToken (two-level token hierarchy, M1)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Bridges the `log` crate into `tracing`. russh still emits via `log` (NOT
# tracing), so this is required to capture its KEX/algorithm negotiation in the
# dev log.
tracing-log = "0.2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }

# Tauri plugins (registered as no-ops in M0; wired to behavior in M3/M4/M6).
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }
# russh 0.62 fixes the strict-kex negotiation bug that made 0.45 unable to talk
# to OpenSSH 8.9+ servers (0.45 could select the `kex-strict-*` signaling MARKER
# as the real KEX → `Error::UnknownAlgo`; see ssh/client.rs). Its `client`/
# `server` `Handler` traits are native-async (RPITIT: `fn -> impl Future`), so
# impls use plain `async fn` — no `async-trait` crate needed anymore. Keys now
# live under `russh::keys` (the separate `russh-keys` crate is gone).
russh = "0.62"
# No-echo password prompt for `set-password` / `add --password` / `web set-password`.
rpassword = "7"

# Web UI server for `tunnel-pilot-cli` (feature `server`, spec 02 §10 / 03 §22).
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "ws", "query"], optional = true }
argon2 = { version = "0.5", features = ["std"], optional = true }
getrandom = { version = "0.3", optional = true }
# Serve connections ourselves (header-read timeout + connection cap, which
# `axum::serve` does not offer) — slowloris defence.
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }

# OS keychain (credentials/, M2). keyring v3 ships NO backend by default (F9):
# each target MUST pin its native backend feature or `keychain_available()` is
# always false and every secret silently hits the plaintext fallback. See the
# per-target dependency blocks below.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"], optional = true }
# Minimal objc2 msg_send shim for `NSApplication.activateIgnoringOtherApps`
# (front the window when the app runs as an Accessory agent — BUG 1). objc2 is
# already in the tree via Tauri; pinning it makes the shim's use explicit.
objc2 = { version = "0.6", optional = true }
# Native macOS notifications, used DIRECTLY (not via tauri-plugin-notification).
# The plugin's desktop path (desktop.rs `show()`) is fire-and-forget through
# notify-rust with no handle → no action buttons and no click callback on
# desktop (those are mobile-only). mac-notification-sys is the same native
# backend notify-rust wraps, and it exposes a "Show" action button plus a
# blocking `send()` that returns whether the banner/body was clicked — that's
# how a click/"Show" opens the window (notify.rs). Already in the tree via
# notify-rust; pinned here to use it directly.
mac-notification-sys = { version = "0.6", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Linux Secret Service backend. Needs a running D-Bus/keyring daemon at runtime;
# on headless Linux the boot probe fails and we fall back to the secrets file.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"], optional = true }

[dev-dependencies]
tempfile = "3"
# Read response bodies in the in-process web router tests.
http-body-util = "0.1"

[features]
# The desktop app `tunnel-pilot`. On by default so `pnpm tauri dev|build` and
# plain `cargo build` are unchanged.
default = ["gui"]
gui = [
    "keychain",
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-single-instance",
    "dep:tauri-plugin-autostart",
    "dep:tauri-plugin-notification",
    "dep:tauri-plugin-updater",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-clipboard-manager",
    "dep:objc2",
    "dep:mac-notification-sys",
]
# The headless server product `tunnel-pilot-cli`: daemon, systemd/launchd
# service and the embedded web UI (spec 03 §22). Build it with
#   cargo build --release --no-default-features --features server           (Linux)
#   cargo build --release --no-default-features --features server,keychain  (macOS)
server = ["dep:axum", "dep:argon2", "dep:getrandom", "dep:hyper", "dep:hyper-util", "dep:tower"]
# OS keychain via `keyring`. Without it every password goes to the 0600
# fallback secrets file — the same route a headless Linux box (no Secret
# Service) already takes at runtime (spec 03 §9).
keychain = ["dep:keyring"]
# this feature is used for production builds or when a dev server is not specified,
# DO NOT REMOVE!!
custom-protocol = ["gui", "tauri/custom-protocol"]
