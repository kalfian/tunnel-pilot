name: tauri-build

# Cross-platform BUILD-ONLY CI for the Tauri v2 app (spec 06 §4).
#
# Post-cutover this is the primary CI gate on `master` (the Flutter v1 app and its
# `release.yml` were removed in the v2 rewrite). It still runs on `rewrite/tauri`
# so the branch stays green until the merge. No OS code-signing and no updater
# (minisign) signing here — that runs only in the tag-triggered release workflow
# (tauri-release.yml). CI is the only push/release path (project rule); this job
# never publishes.

on:
  push:
    branches: [master, rewrite/tauri]
  pull_request:
    branches: [master, rewrite/tauri]
  workflow_dispatch:

concurrency:
  group: tauri-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Tauri v2 Linux system dependencies (webkit2gtk, gtk, appindicator, etc.).
      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libxdo-dev \
            build-essential \
            curl wget file

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Frontend checks (svelte-check + lint)
        run: |
          pnpm check
          pnpm lint

      - name: Rust checks (fmt + clippy)
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      # Build the Tauri bundle for the host OS. Unsigned (see header). This runs
      # `pnpm build` (frontend) via beforeBuildCommand, then the Rust release
      # build + bundler.
      # `createUpdaterArtifacts` is true in tauri.conf.json, which makes the
      # bundler REQUIRE `TAURI_SIGNING_PRIVATE_KEY` and fail after the bundles
      # are already built. That key is a release-only secret and deliberately
      # stays out of this gate (which also runs on pull_request, where fork PRs
      # get no secrets). Override the flag off: this job verifies that the app
      # compiles and bundles, not that it can be signed — tauri-release.yml
      # owns signing.
      # The override lives in a file rather than inline JSON so the same command
      # works under bash and the Windows runner's PowerShell without quoting
      # games.
      - name: Build Tauri app (unsigned, no updater artifacts)
        run: pnpm tauri build --config src-tauri/tauri.ci-gate.conf.json

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tunnel-pilot-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**
          if-no-files-found: warn
          retention-days: 7

  # The server product `tunnel-pilot-cli` (spec 03 §22): `--no-default-features
  # --features server` drops Tauri, WebKit and GTK and adds the web UI server.
  # Checked separately because the `build` job above only compiles the desktop
  # (`gui`) feature set — a cfg mistake in the server path would otherwise ship.
  # macOS adds `keychain` (the shipped macOS server build keeps the OS keychain).
  cli-headless:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, features: "server" }
          - { os: macos-latest, features: "server,keychain" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: cli-headless

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build the web UI (embedded into tunnel-pilot-cli)
        run: |
          pnpm install --frozen-lockfile
          pnpm build:web

      - name: fmt + clippy + test (server)
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --no-default-features --features ${{ matrix.features }} --all-targets -- -D warnings
          cargo test --no-default-features --features ${{ matrix.features }}

      - name: Smoke-test the binary
        working-directory: src-tauri
        run: |
          cargo build --release --no-default-features --features ${{ matrix.features }} --bin tunnel-pilot-cli
          ./target/release/tunnel-pilot-cli --version | grep -q '(cli)'
          ls -l target/release/tunnel-pilot-cli
