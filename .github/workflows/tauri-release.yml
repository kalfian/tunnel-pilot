name: tauri-release

# Tag-triggered cross-platform Tauri v2 release with SIGNED updater bundles
# (spec 06 §4, spec 03 §16). CI is the only release path (project rule).
#
# Two distinct signing tiers — keep them straight:
#   1. Updater BUNDLE signing (minisign) — REQUIRED, FREE, wired below. Signs each
#      update bundle with the minisign private key (a CI secret) and emits
#      `latest.json`; the app verifies it against the pubkey embedded in
#      tauri.conf.json. Enforced from day one.
#   2. OS code-signing / notarization (Apple Developer ID, Windows Authenticode) —
#      SKIPPED for v2.0 (open-source / unfunded; paid certs). The env keys are
#      left COMMENTED below so a future funded maintainer can enable them by
#      populating secrets — no workflow restructuring needed. Users bypass
#      Gatekeeper via right-click → Open (macOS) / SmartScreen "More info → Run
#      anyway" (Windows). This tier is INDEPENDENT of tier 1.
#
# SECURITY: the minisign private key + its password live ONLY as GitHub Actions
# secrets (TAURI_UPDATER_PRIVATE_KEY / TAURI_UPDATER_KEY_PASSWORD) — never in the
# repo (org policy + AGENTS §8). Only the PUBLIC key is committed (tauri.conf.json).

on:
  push:
    tags: ["v2.*"] # v2 releases only (Flutter v1 + its release.yml were removed in the rewrite)
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release (e.g. v2.0.0)"
        required: true

concurrency:
  group: tauri-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: universal-apple-darwin, args: "--target universal-apple-darwin" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, args: "" }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, args: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libxdo-dev \
            build-essential \
            curl wget file

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS universal binary needs both arch targets.
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build + sign updater bundle, publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Updater BUNDLE signing (minisign) — REQUIRED, free. Secrets only. ---
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_KEY_PASSWORD }}
          # --- OS code-signing / notarization: STUBBED / DISABLED for v2.0 ---
          # Intentionally NOT set (paid certs the project does not have). Leave
          # these commented so a future funded maintainer can enable OS signing by
          # populating the secrets — no workflow restructuring needed:
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # (Windows Authenticode signing similarly left unset.)
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Tunnel Pilot ${{ github.event.inputs.tag || github.ref_name }}"
          releaseDraft: true
          prerelease: false
          # Emits `latest.json` next to the signed bundles so `tauri-plugin-updater`
          # resolves the configured GitHub Releases endpoint (spec 03 §16).
          includeUpdaterJson: true
          args: ${{ matrix.args }}
