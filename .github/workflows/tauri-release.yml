name: tauri-release

# Tag-triggered cross-platform Tauri v2 release with SIGNED updater bundles
# (spec 06 §4, spec 03 §16). CI is the only release path (project rule).
#
# Two distinct signing tiers — keep them straight:
#   1. Updater BUNDLE signing (minisign) — REQUIRED, FREE, wired below. Signs each
#      update bundle with the minisign private key (a CI secret) and emits
#      `latest.json`; the app verifies it against the pubkey embedded in
#      tauri.conf.json. Enforced from day one.
#   2. OS code-signing / notarization (Apple Developer ID, Windows Authenticode) —
#      SKIPPED for v2.0 (open-source / unfunded; paid certs). The env keys are
#      left COMMENTED below so a future funded maintainer can enable them by
#      populating secrets — no workflow restructuring needed. Users bypass
#      Gatekeeper via right-click → Open (macOS) / SmartScreen "More info → Run
#      anyway" (Windows). This tier is INDEPENDENT of tier 1.
#
# SECURITY: the minisign private key + its password live ONLY as GitHub Actions
# secrets (TAURI_UPDATER_PRIVATE_KEY / TAURI_UPDATER_KEY_PASSWORD) — never in the
# repo (org policy + AGENTS §8). Only the PUBLIC key is committed (tauri.conf.json).

on:
  push:
    tags: ["v2.*"] # v2 releases only (Flutter v1 + its release.yml were removed in the rewrite)
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release (e.g. v2.0.0)"
        required: true

concurrency:
  group: tauri-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: universal-apple-darwin, args: "--target universal-apple-darwin" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, args: "" }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, args: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libxdo-dev \
            build-essential \
            curl wget file

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS universal binary needs both arch targets.
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build + sign updater bundle, publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Updater BUNDLE signing (minisign) — REQUIRED, free. Secrets only. ---
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_KEY_PASSWORD }}
          # --- OS code-signing / notarization: STUBBED / DISABLED for v2.0 ---
          # Intentionally NOT set (paid certs the project does not have). Leave
          # these commented so a future funded maintainer can enable OS signing by
          # populating the secrets — no workflow restructuring needed:
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # (Windows Authenticode signing similarly left unset.)
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Tunnel Pilot ${{ github.event.inputs.tag || github.ref_name }}"
          releaseDraft: true
          prerelease: false
          # Emits `latest.json` next to the signed bundles so `tauri-plugin-updater`
          # resolves the configured GitHub Releases endpoint (spec 03 §16).
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # CLI-only edition (spec 03 §21): a small binary with no Tauri/WebKit/GTK for
  # servers and headless boxes, installed by `install.sh --cli`. Linux builds
  # are static musl (run on any distro, no glibc floor); macOS is a universal
  # binary that keeps the OS keychain (`--features keychain`). Each archive gets
  # a `.sha256` sidecar that install.sh verifies. Uploaded to the same draft
  # release the desktop job created, hence `needs: release`.
  cli:
    needs: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, asset: linux-x86_64, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, asset: linux-aarch64, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, asset: macos-universal, target: universal }
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install musl toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'Linux' && matrix.target || 'aarch64-apple-darwin,x86_64-apple-darwin' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: cli-${{ matrix.asset }}

      - name: Build (Linux, static musl)
        if: runner.os == 'Linux'
        working-directory: src-tauri
        env:
          # aws-lc-sys (russh's crypto) compiles C. cc-rs would look for a
          # `<arch>-linux-musl-gcc` cross compiler that musl-tools does not
          # ship; its `musl-gcc` wrapper targets the runner's own arch, which
          # is why aarch64 builds on a native arm runner.
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: |
          cargo build --release --locked --no-default-features --target ${{ matrix.target }}
          mkdir -p ../dist
          cp target/${{ matrix.target }}/release/tunnel-pilot ../dist/tunnel-pilot
          strip ../dist/tunnel-pilot

      - name: Build (macOS, universal + keychain)
        if: runner.os == 'macOS'
        working-directory: src-tauri
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --no-default-features --features keychain --target "$t"
          done
          mkdir -p ../dist
          lipo -create -output ../dist/tunnel-pilot \
            target/aarch64-apple-darwin/release/tunnel-pilot \
            target/x86_64-apple-darwin/release/tunnel-pilot
          strip -x ../dist/tunnel-pilot

      - name: Package + checksum
        run: |
          ./dist/tunnel-pilot --version | grep -q '(cli)'
          name="tunnel-pilot-cli-${{ matrix.asset }}.tar.gz"
          tar -czf "$name" -C dist tunnel-pilot
          if command -v sha256sum >/dev/null; then sha256sum "$name" > "$name.sha256"; else shasum -a 256 "$name" > "$name.sha256"; fi
          cat "$name.sha256"
          ls -l "$name"

      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" tunnel-pilot-cli-${{ matrix.asset }}.tar.gz tunnel-pilot-cli-${{ matrix.asset }}.tar.gz.sha256 --clobber
