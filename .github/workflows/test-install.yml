name: Test Install Script

# Validates the v2 one-liner installers (docs/install.sh, docs/install.ps1).
#
# Two tiers, kept separate so the workflow is NEVER spuriously red before v2 is
# published:
#   1. unit-test  — network-free. Sources install.sh and exercises platform
#      detection, JSON asset-URL matching, and the AppImage install path against
#      fixtures. Runs on every dispatch; needs no release to exist.
#   2. e2e-*      — live `releases/latest` download + real install. GATED: only
#      runs on a published release, or on a manual dispatch with run_e2e=true.
#      Skipped by default so the pre-release absence of a v2 release can't fail CI.

on:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run live-download E2E (requires a published v2 release)"
        type: boolean
        default: false
  release:
    types: [published]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Job 1: Unit tests (no network, no real release needed) ──────────────────
  unit-test:
    name: Unit tests (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # jq pre-installed on Ubuntu; Windows Git Bash falls back to grep/sed
      - name: Run unit tests
        shell: bash
        run: bash docs/install_test.sh

  # ── Job 2: Real install on Linux — download AppImage, install, verify ────────
  e2e-linux:
    name: E2E install (Linux)
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || inputs.run_e2e
    steps:
      - name: Install runtime dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libayatana-appindicator3-1 \
            libnotify4 \
            libgtk-3-0 \
            libwebkit2gtk-4.1-0 \
            libfuse2 \
            xvfb

      - name: Install Tunnel Pilot via install script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: curl -fsSL https://kalfian.github.io/tunnel-pilot/install.sh | bash

      - name: Verify installation
        run: |
          APP_DIR="$HOME/.local/share/tunnel-pilot"
          LAUNCHER="$HOME/.local/bin/tunnel-pilot"

          echo "==> Checking files..."
          test -d "$APP_DIR"  && echo "  ✓ App dir exists"
          APPIMAGE=$(find "$APP_DIR" -maxdepth 1 -name '*.AppImage' | head -1)
          test -n "$APPIMAGE"  && echo "  ✓ AppImage present: $APPIMAGE"
          test -x "$APPIMAGE"  && echo "  ✓ AppImage is executable"
          test -f "$LAUNCHER"  && echo "  ✓ Launcher present"
          test -x "$LAUNCHER"  && echo "  ✓ Launcher is executable"

          echo ""
          echo "==> Launcher content:"
          cat "$LAUNCHER"

      - name: Smoke test — launch with virtual display (best-effort)
        continue-on-error: true
        env:
          # Run the AppImage without a FUSE mount (CI-friendly).
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1024x768x24 2>/dev/null &
          XVFB_PID=$!
          sleep 1

          echo "==> Starting tunnel-pilot..."
          "$HOME/.local/bin/tunnel-pilot" &
          APP_PID=$!
          sleep 3

          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "  ✓ App is running (PID $APP_PID)"
            kill "$APP_PID" 2>/dev/null || true
          else
            wait "$APP_PID" || true
            echo "  ⚠ App exited (no usable tray/display in CI) — device-gated, see CUTOVER §3"
          fi

          kill "$XVFB_PID" 2>/dev/null || true

  # ── Job 3: Real install on macOS — download .dmg, install, verify ────────────
  e2e-macos:
    name: E2E install (macOS)
    runs-on: macos-latest
    if: github.event_name == 'release' || inputs.run_e2e
    steps:
      - name: Install Tunnel Pilot via install script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: curl -fsSL https://kalfian.github.io/tunnel-pilot/install.sh | bash

      - name: Verify installation
        run: |
          APP="/Applications/Tunnel Pilot.app"
          BIN="$APP/Contents/MacOS/tunnel-pilot"

          echo "==> Checking files..."
          test -d "$APP"  && echo "  ✓ App bundle exists"
          test -f "$BIN"  && echo "  ✓ Binary present"
          test -x "$BIN"  && echo "  ✓ Binary is executable"

          echo ""
          echo "==> App bundle contents:"
          ls -la "$APP/Contents/MacOS/"

      - name: Smoke test — launch briefly (best-effort)
        continue-on-error: true
        run: |
          APP="/Applications/Tunnel Pilot.app"
          echo "==> Starting Tunnel Pilot..."
          open -a "Tunnel Pilot" || "$APP/Contents/MacOS/tunnel-pilot" &
          APP_PID=$!
          sleep 2
          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "  ✓ App is running (PID $APP_PID)"
            kill "$APP_PID" 2>/dev/null || true
          else
            echo "  ⚠ App exited (device-gated behavior, see CUTOVER §3)"
          fi

  # ── Job 4: Real install on Windows via the bash installer (Git Bash) ─────────
  e2e-windows-bash:
    name: E2E install (Windows / Git Bash)
    runs-on: windows-latest
    if: github.event_name == 'release' || inputs.run_e2e
    steps:
      - name: Install Tunnel Pilot via install.sh (runs NSIS -setup.exe)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: curl -fsSL https://kalfian.github.io/tunnel-pilot/install.sh | bash

      - name: Verify installation
        shell: pwsh
        run: |
          # NSIS currentUser install lands under %LOCALAPPDATA%; locate the exe.
          $exe = Get-ChildItem -Path $env:LOCALAPPDATA -Recurse -Filter "tunnel-pilot.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($exe) {
            Write-Host "  ✓ Installed exe found: $($exe.FullName)"
          } else {
            Write-Host "  ✗ tunnel-pilot.exe not found under $env:LOCALAPPDATA"
            exit 1
          }

  # ── Job 5: Real install on Windows via the PowerShell installer ──────────────
  e2e-windows-ps:
    name: E2E install (Windows / PowerShell)
    runs-on: windows-latest
    if: github.event_name == 'release' || inputs.run_e2e
    steps:
      - name: Install Tunnel Pilot via install.ps1 (runs NSIS -setup.exe)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          irm https://kalfian.github.io/tunnel-pilot/install.ps1 | iex

      - name: Verify installation
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path $env:LOCALAPPDATA -Recurse -Filter "tunnel-pilot.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($exe) {
            Write-Host "  ✓ Installed exe found: $($exe.FullName)"
          } else {
            Write-Host "  ✗ tunnel-pilot.exe not found under $env:LOCALAPPDATA"
            exit 1
          }
